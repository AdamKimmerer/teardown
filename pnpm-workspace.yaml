packages:
  - packages/*
  - apps/*

# pnpm 12 blocks dependency install scripts unless listed. esbuild's script installs its
# platform binary; it is used by tsx and vitest here and by the extension build later.
allowBuilds:
  esbuild: true

# pnpm 12 waits for a package version to age before installing it (supply-chain guard).
# Versions pinned in package.json that are newer than that window are listed here.
minimumReleaseAgeExclude:
  - "@types/node@22.20.4"
  - openai@7.20.0

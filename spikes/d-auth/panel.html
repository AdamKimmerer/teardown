<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spike D</title>
    <style>
      body {
        font:
          14px/1.5 system-ui,
          sans-serif;
        margin: 0;
        padding: 1rem;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 0.5rem;
      }
      button {
        font: inherit;
        display: block;
        width: 100%;
        padding: 0.5rem;
        margin: 0.4rem 0;
      }
      .verdict {
        font-weight: bold;
        padding: 0.5rem;
        margin: 0.5rem 0;
        background: #eee;
      }
      .pass {
        background: #cfc;
      }
      .fail {
        background: #fcc;
      }
      pre {
        background: #f3f3f3;
        padding: 0.5rem;
        white-space: pre-wrap;
        font-size: 12px;
        max-height: 50vh;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Spike D: Google sign-in</h1>
    <div>Extension id: <code id="extid"></code></div>
    <div>Signed in as: <span id="who">nobody</span></div>
    <button id="signin">1. Sign in with Google (launchWebAuthFlow)</button>
    <button id="me">
      2. GET /v1/me on the local API with the Supabase token
    </button>
    <button id="refresh">
      3. Refresh the session (forces a token refresh)
    </button>
    <button id="signout">Sign out</button>
    <div id="verdict" class="verdict">no result yet</div>
    <pre id="log"></pre>
    <script src="panel.js"></script>
  </body>
</html>

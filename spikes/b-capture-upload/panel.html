<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spike B</title>
    <style>
      body {
        font:
          14px/1.5 system-ui,
          sans-serif;
        margin: 0;
        padding: 1rem;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 0.5rem;
      }
      button {
        font: inherit;
        display: block;
        width: 100%;
        padding: 0.5rem;
        margin: 0.4rem 0;
      }
      .verdict {
        font-weight: bold;
        padding: 0.5rem;
        margin: 0.5rem 0;
        background: #eee;
      }
      .pass {
        background: #cfc;
      }
      .fail {
        background: #fcc;
      }
      .strip {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 0.5rem 0;
      }
      .strip img {
        width: 120px;
        border: 1px solid #999;
      }
      pre {
        background: #f3f3f3;
        padding: 0.5rem;
        white-space: pre-wrap;
        font-size: 12px;
        max-height: 40vh;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Spike B: capture → IndexedDB → upload</h1>
    <p>
      Start the presign server first:
      <code
        >node --env-file=apps/api/.env
        spikes/b-capture-upload/presign-server.mjs</code
      >
    </p>
    <div>Presign server: <span id="server">checking…</span></div>
    <button id="capture">1. Capture visible tab (PNG → IndexedDB)</button>
    <button id="burst">2. Burst: 5 captures at once (rate limit)</button>
    <button id="upload">3. Upload last capture to Supabase</button>
    <button id="big">4. Upload a 6 MB blob</button>
    <button id="clear">Clear IndexedDB</button>
    <div id="verdict" class="verdict">no result yet</div>
    <div class="strip" id="strip"></div>
    <pre id="log"></pre>
    <script type="module" src="panel.js"></script>
  </body>
</html>
